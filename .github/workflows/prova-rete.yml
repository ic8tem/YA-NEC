# YA-NEC - prova dei servizi esterni dei dati (DEM TINITALY via WCS, SRTM1 di AWS Terrain Tiles, mattonelle Esri): i risultati vanno nella
# Release in bozza "anteprima" (non pubblica). Si avvia a mano.
name: prova-rete

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica
        run: |
          mkdir out && cd out
          # Capri, intorno a JN70CN: UTM 32N (TINITALY), E 958000-962000, N 4492000-4496000 circa
          curl -sS -o tinitaly.tif -w "tinitaly %{http_code} %{content_type} %{size_download}\n" "https://tinitaly.pi.ingv.it/TINItaly_1_1/wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=TINItaly_1_1__tinitaly_dem&subset=E(958000,962000)&subset=N(4492000,4496000)&format=image/tiff" | tee -a log.txt
          curl -sS -o tinitaly_ll.tif -w "tinitaly_ll %{http_code} %{content_type} %{size_download}\n" "https://tinitaly.pi.ingv.it/TINItaly_1_1/wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=TINItaly_1_1__tinitaly_dem&subsettingCrs=http://www.opengis.net/def/crs/EPSG/0/4326&subset=Lat(40.53,40.57)&subset=Long(14.19,14.25)&format=image/tiff" | tee -a log.txt
          curl -sS -o describe.xml -w "describe %{http_code}\n" "https://tinitaly.pi.ingv.it/TINItaly_1_1/wcs?service=WCS&version=2.0.1&request=DescribeCoverage&coverageId=TINItaly_1_1__tinitaly_dem" | tee -a log.txt
          curl -sS -o N40E014.hgt.gz -w "srtm %{http_code} %{content_type} %{size_download}\n" "https://elevation-tiles-prod.s3.amazonaws.com/skadi/N40/N40E014.hgt.gz" | tee -a log.txt
          curl -sS -o esri.jpg -w "esri %{http_code} %{content_type} %{size_download}\n" "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/14/6075/8838" | tee -a log.txt
          curl -sS -A "YA-NEC/1.2 (github.com/ic8tem/YA-NEC)" -o osm.png -w "osm %{http_code} %{content_type} %{size_download}\n" "https://tile.openstreetmap.org/14/8838/6075.png" | tee -a log.txt
          head -c 300 tinitaly.tif | strings | head -5 >> log.txt || true
          ls -l >> log.txt
          zip -q ../prova-rete.zip *
      - name: Carica nella bozza
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft and .name=="anteprima") | .id' | head -1)
          for a in $(gh api repos/${{ github.repository }}/releases/$id/assets --jq '.[] | select(.name=="prova-rete.zip") | .id'); do gh api -X DELETE repos/${{ github.repository }}/releases/assets/$a; done
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @prova-rete.zip "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=prova-rete.zip"
