# YA-NEC - immagini della finestra per il README e la wiki: compila linux-x64, avvia --schermate sotto Xvfb (con la rete, per i DEM
# e le mappe) e mette le immagini nella Release in bozza "schermate" (le bozze non sono pubbliche). Si avvia a mano.
name: schermate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  schermate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compila
        run: dotnet publish YA-NEC.csproj -c Release -r linux-x64 --self-contained true -p:Version=$(tr -d ' \r\n' < VERSION) -o pub/YA-NEC
      - name: Immagini
        run: |
          sudo apt-get install -y xvfb fonts-dejavu-core > /dev/null
          chmod +x pub/YA-NEC/YA-NEC
          timeout 900 xvfb-run -s "-screen 0 1700x1100x24" ./pub/YA-NEC/YA-NEC --schermate || true
          ls -la pub/YA-NEC/data/schermate || true
          cat pub/YA-NEC/data/schermate/schermate.txt || true
      - name: Cache di DEM e mappe per il videocorso (le registrazioni si fanno senza rete)
        run: |
          python3 - <<'PYEOF'
          import math, os, urllib.request
          lat, lon = 40.5508, 14.2410          # JN70CN82WE, il locatore delle schermate
          base = 'pub/YA-NEC/data/mappe/foto'
          n = 0
          for z in range(6, 19):
              t = 2 ** z
              x0 = int((lon + 180) / 360 * t)
              y0 = int((1 - math.asinh(math.tan(math.radians(lat))) / math.pi) / 2 * t)
              for x in range(x0 - 3, x0 + 4):
                  for y in range(y0 - 2, y0 + 3):
                      f = '%s/%d/%d/%d.jpg' % (base, z, x, y)
                      if os.path.exists(f): continue
                      os.makedirs(os.path.dirname(f), exist_ok=True)
                      url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/%d/%d/%d' % (z, y, x)
                      req = urllib.request.Request(url, headers={'User-Agent': 'YA-NEC/1.2 (+https://github.com/ic8tem/YA-NEC)'})
                      try:
                          open(f, 'wb').write(urllib.request.urlopen(req, timeout=20).read()); n += 1
                      except Exception as e:
                          print('mattonella', z, x, y, e)
          print('mattonelle scaricate', n)
          PYEOF
          (cd pub/YA-NEC/data && zip -qr ../../../cache-corso.zip dem mappe) || true
          ls -la cache-corso.zip || true
      - name: Release in bozza
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft and .name=="schermate") | .id' | head -1)
          if [ -z "$id" ]; then id=$(gh api repos/${{ github.repository }}/releases -X POST -f tag_name=schermate -f name=schermate -F draft=true -f target_commitish=${{ github.sha }} --jq .id); fi
          for a in $(gh api repos/${{ github.repository }}/releases/$id/assets --jq '.[].id'); do gh api -X DELETE repos/${{ github.repository }}/releases/assets/$a; done
          for f in pub/YA-NEC/data/schermate/* cache-corso.zip; do
            [ -f "$f" ] || continue
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @$f "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=$(basename $f)" > /dev/null
          done
