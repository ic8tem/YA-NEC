# YA-NEC: tabelle degli angoli di arrivo con VOACAP (proposte h3/h4, IC8TEM 18/11/2026). Si lancia a mano.
# voacapl: J. A. Watson, https://github.com/jawatson/voacapl (CC0; VOACAP NTIA/ITS, pubblico dominio), commit c12a98b
name: angoli
on:
  workflow_dispatch:
    inputs:
      origini:
        description: "origini separate da virgole (vuoto = tutte)"
        required: false
        default: ""
jobs:
  angoli:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: voacapl
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gfortran autoconf automake
          git clone -q https://github.com/jawatson/voacapl.git /tmp/voacapl && cd /tmp/voacapl && git checkout -q c12a98b
          autoreconf -fi >/dev/null && ./configure --prefix=$HOME/voacap >/dev/null && make -j4 >/dev/null && make install >/dev/null
          cd ~ && $HOME/voacap/bin/makeitshfbc && test -d $HOME/itshfbc/run
          mkdir -p $GITHUB_WORKSPACE/angoli && cp /tmp/voacapl/COPYING /tmp/voacapl/AUTHORS $GITHUB_WORKSPACE/angoli/
      - name: tabelle
        env:
          VOACAPL: /home/runner/voacap/bin/voacapl
        run: |
          O="${{ github.event.inputs.origini }}"
          if [ -n "$O" ]; then python3 tools/angoli/angoli_voacap.py --its $HOME/itshfbc --out angoli --origini "$O" --workers 4
          else python3 tools/angoli/angoli_voacap.py --its $HOME/itshfbc --out angoli --workers 4; fi
      - uses: actions/upload-artifact@v4
        with:
          name: angoli-voacap
          path: angoli
