# YA-NEC - compilazione e pacchetti per Windows, Linux e Mac.
# Con un push sul ramo release, o un tag vX.Y (o avviandolo a mano): pacchetti di tutte le piattaforme e Release vX.Y (versione letta dal file VERSION).
# A ogni push sul ramo main: solo una compilazione di controllo su Linux (Windows 7 compreso).
# Nomi dei pacchetti (1.3.1, armonizzati con l'elenco di YA-MS, richiesta di IC8TEM del 18/11/2026): -windows-x64-setup.exe e
# -windows-x64-portatile.zip, -mac-apple-silicon.dmg e -app.zip, .deb, .rpm, Arch, Slackware, AppImage, -linux-x64.tar.gz,
# -raspberry-pi-64bit/32bit.tar.gz, -alpine-x64.tar.gz..., tutti con il loro .sha256: l'aggiornamento automatico dalla 1.3.1 cerca
# questi (src/Diag/Aggiornamento.cs). Restano anche gli zip YA-NEC-<versione>-<rid>.zip, che cercano le versioni fino alla 1.3.0.
name: build

on:
  push:
    branches: [ main, release ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  controllo:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Compila (.NET 8)
        run: dotnet build YA-NEC.csproj -c Release
      - name: Compila per Windows 7 (.NET 6)
        run: |
          rm -rf /tmp/w7 && mkdir /tmp/w7 && git archive HEAD | tar -x -C /tmp/w7
          dotnet build /tmp/w7/YA-NEC.csproj -c Release -p:Windows7=true
      # 1.5.3 (IC8TEM 20/11/2026 12:32 «mi devi pure verificare sempre questo»): ogni modello d'esempio letto, calcolato, passato da
      # Ridimensiona e dalla Verifica della segmentazione con «tutti»; la compilazione fallisce se una delle due da' errore.
      - name: Prova dei modelli d'esempio (Ridimensiona e Segmentazione)
        shell: bash
        run: |
          DLL=$(ls bin/Release/net8.0*/YA-NEC.dll | head -1)
          timeout 900 dotnet "$DLL" --converti data/modelli /tmp/conv
          cut -d';' -f1,2,5,10,11,12,14,15,16 /tmp/conv/converti.csv
          if cut -d';' -f15,16 /tmp/conv/converti.csv | grep -q "errore"; then echo "::error::Ridimensiona o Segmentazione con errori"; exit 1; fi

  pacchetti:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,          nome: win-x64,          w7: false, os: ubuntu-latest }
          - { rid: win-x86,          nome: win-x86,          w7: false, os: ubuntu-latest }
          - { rid: win-arm64,        nome: win-arm64,        w7: false, os: ubuntu-latest }
          - { rid: win-x64,          nome: win7-x64,         w7: true,  os: ubuntu-latest }
          - { rid: win-x86,          nome: win7-x86,         w7: true,  os: ubuntu-latest }
          - { rid: linux-x64,        nome: linux-x64,        w7: false, os: ubuntu-latest }
          - { rid: linux-arm64,      nome: linux-arm64,      w7: false, os: ubuntu-latest }
          - { rid: linux-arm,        nome: linux-arm,        w7: false, os: ubuntu-latest }
          - { rid: linux-musl-x64,   nome: linux-musl-x64,   w7: false, os: ubuntu-latest }
          - { rid: linux-musl-arm64, nome: linux-musl-arm64, w7: false, os: ubuntu-latest }
          - { rid: osx-arm64,        nome: osx-arm64,        w7: false, os: macos-latest }
          - { rid: osx-x64,          nome: osx-x64,          w7: false, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Versione
        shell: bash
        run: echo "VER=$(tr -d ' \r\n' < VERSION)" >> $GITHUB_ENV
      - name: Compila
        shell: bash
        run: dotnet publish YA-NEC.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Windows7=${{ matrix.w7 }} -p:Version=$VER -o pub/YA-NEC
      - name: Pacchetto
        shell: bash
        run: |
          rm -rf pub/YA-NEC/data/prove pub/YA-NEC/data/config.ini pub/YA-NEC/Registri
          case "${{ matrix.rid }}" in win-*) ;; *) chmod +x pub/YA-NEC/YA-NEC ;; esac
          if [[ "${{ matrix.rid }}" == osx-* ]]; then codesign --force -s - pub/YA-NEC/YA-NEC; for f in pub/YA-NEC/lib/*.dylib; do codesign --force -s - "$f" || true; done; fi
          mkdir -p dist
          Z="YA-NEC-$VER-${{ matrix.nome }}.zip"
          (cd pub && zip -qr -y "../dist/$Z" YA-NEC)
          (cd dist && shasum -a 256 "$Z" | awk -v n="$Z" '{print $1"  "n}' > "$Z.sha256")
          ls -l dist
      - name: Prova di avvio (autotest del motore)
        if: matrix.rid == 'linux-x64'
        run: timeout 600 ./pub/YA-NEC/YA-NEC --autotest 2>&1 | tail -40 || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome }}
          path: dist/*

  # 1.0.5 (IC8TEM 16/11/2026 15:55 "mi devi fare l'installatore per ya-nec"): installatori costruiti dagli zip appena compilati.
  # Windows: setup.exe con Inno Setup (C:\YA-NEC, senza amministratore); Linux: .deb e .rpm (/opt/YA-NEC); Mac: .dmg.
  installatori-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    needs: [ pacchetti ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: zip
          pattern: win*
          merge-multiple: true
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: setup.exe per ogni pacchetto Windows
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($n in 'win-x64','win-x86','win-arm64','win7-x64','win7-x86') {
            $z = "zip\YA-NEC-$ver-$n.zip"
            Expand-Archive $z -DestinationPath "x\$n" -Force
            $arch = ($n -split '-')[1]
            $nuovo = $n -replace '^win7-','windows7-' -replace '^win-','windows-'
            $extra = @(); if ($n -like 'win7*') { $extra += '/DYWin7' }
            & $iscc "/DYVer=$ver" "/DYArch=$arch" "/DYNome=$nuovo" "/DYSrc=$PWD\x\$n\YA-NEC" "/DYOut=$PWD\dist" "/DYIcona=$PWD\assets\ya-nec.ico" @extra installer\windows\ya-nec.iss
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Copy-Item $z "dist\YA-NEC-$ver-$nuovo-portatile.zip"
          }
          Get-ChildItem dist | ForEach-Object { $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: installatori-windows
          path: dist/*

  # 1.3.1: come YA-MS. Pacchetti per architettura, ciascuno sul suo runner (l'AppImage ARM64 si costruisce su un processore ARM).
  installatori-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    needs: [ pacchetti ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gruppo: x64, os: ubuntu-latest }
          - { gruppo: arm, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: zip
          pattern: linux-*
          merge-multiple: true
      - name: .deb, .rpm, Arch, Slackware, AppImage e tar.gz
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm >/dev/null
          VER=$(tr -d ' \r\n' < VERSION)
          mkdir -p dist
          estrai() { rm -rf "x-$1" && mkdir "x-$1" && unzip -q "zip/YA-NEC-$VER-$1.zip" -d "x-$1"; }
          targz() {   # targz <rid> <nome1> [nome2]: tar.gz portatile con installa.sh e l'icona
            rm -rf pkg && mkdir pkg && cp -a "x-$1/YA-NEC" pkg/YA-NEC
            cp installer/linux/installa.sh pkg/YA-NEC/installa.sh; cp assets/ya-nec-256.png pkg/YA-NEC/ya-nec.png
            chmod +x pkg/YA-NEC/installa.sh pkg/YA-NEC/YA-NEC
            shift; for n in "$@"; do tar -C pkg -czf "dist/YA-NEC-$VER-$n.tar.gz" YA-NEC; done
          }
          if [ "${{ matrix.gruppo }}" = "x64" ]; then
            # anche ARM a 32 bit (armhf / armv7hl) qui, come nella 1.3.0: rpmbuild --target armv7hl collaudato su x86_64
            estrai linux-x64; estrai linux-musl-x64; estrai linux-arm
            bash installer/linux/pacchetti.sh "$PWD/x-linux-x64/YA-NEC" "$VER" amd64 x86_64 "$PWD/dist"
            bash installer/linux/pacchetti.sh "$PWD/x-linux-arm/YA-NEC" "$VER" armhf armv7hl "$PWD/dist"
            bash installer/linux/make-txz.sh x86_64 "$VER" "dist/ya-nec_${VER}_amd64.deb" dist
            bash installer/linux/make-arch.sh x86_64 "$VER" "dist/ya-nec_${VER}_amd64.deb" dist
            bash installer/linux/make-appimage.sh x86_64 "$VER" "$PWD/x-linux-x64/YA-NEC" dist
            targz linux-x64 linux-x64
            targz linux-musl-x64 alpine-x64
            targz linux-arm linux-armv7l raspberry-pi-32bit
          else
            estrai linux-arm64; estrai linux-musl-arm64
            bash installer/linux/pacchetti.sh "$PWD/x-linux-arm64/YA-NEC" "$VER" arm64 aarch64 "$PWD/dist"
            bash installer/linux/make-txz.sh aarch64 "$VER" "dist/ya-nec_${VER}_arm64.deb" dist
            bash installer/linux/make-arch.sh aarch64 "$VER" "dist/ya-nec_${VER}_arm64.deb" dist
            bash installer/linux/make-appimage.sh aarch64 "$VER" "$PWD/x-linux-arm64/YA-NEC" dist
            targz linux-arm64 linux-arm64 raspberry-pi-64bit
            targz linux-musl-arm64 alpine-arm64
          fi
          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done; ls -l)
      - uses: actions/upload-artifact@v4
        with:
          name: installatori-linux-${{ matrix.gruppo }}
          path: dist/*

  installatori-mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    needs: [ pacchetti ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: zip
          pattern: osx-*
          merge-multiple: true
      - name: .dmg
        run: |
          VER=$(tr -d ' \r\n' < VERSION)
          for t in "osx-arm64 mac-apple-silicon" "osx-x64 mac-intel"; do
            set -- $t
            rm -rf x && mkdir x && ditto -x -k "zip/YA-NEC-$VER-$1.zip" x
            bash installer/macos/dmg.sh "$PWD/x/YA-NEC" "$VER" "$2" "$PWD/dist"
          done
          (cd dist && for f in *.dmg *-app.zip; do shasum -a 256 "$f" > "$f.sha256"; done; ls -l)
      - uses: actions/upload-artifact@v4
        with:
          name: installatori-mac
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    needs: [ pacchetti, installatori-windows, installatori-linux, installatori-mac ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        run: echo "VER=$(tr -d ' \r\n' < VERSION)" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Descrizioni per winget, Scoop e Chocolatey (da inviare ai registri solo se IC8TEM lo decide)
        run: |
          python3 installer/gestori/genera.py "$VER" dist gestori
          (cd gestori && zip -qr "../dist/YA-NEC-$VER-gestori-winget-scoop-chocolatey.zip" .)
      - name: Note della versione (tabella dei download con la versione giusta)
        run: sed -i "s/@VER@/$VER/g" .github/release.md
      # 1.7.2 (controllo di sicurezza del 26/11/2026): firma ECDSA P-256 dei pacchetti dell'aggiornamento automatico (<pacchetto>.sig, base64).
      # La chiave privata e' il segreto YA_NEC_FIRMA e serve solo a questo passo; senza segreto la release non si pubblica (il programma
      # dalla 1.7.2 non installa pacchetti senza firma). La chiave pubblica e' in src/Diag/Aggiornamento.cs.
      - name: Firma dei pacchetti dell'aggiornamento
        env:
          FIRMA: ${{ secrets.YA_NEC_FIRMA }}
        run: |
          if [ -z "$FIRMA" ]; then echo "::error::manca il segreto YA_NEC_FIRMA: pacchetti non firmati, release fermata"; exit 1; fi
          K="$RUNNER_TEMP/firma.pem"; umask 077; printf '%s\n' "$FIRMA" > "$K"
          openssl ec -in "$K" -pubout -out "$RUNNER_TEMP/pub.pem" 2>/dev/null
          shopt -s nullglob; n=0
          for f in dist/*-portatile.zip dist/*-linux-x64.tar.gz dist/*-linux-arm64.tar.gz dist/*-linux-armv7l.tar.gz dist/*-alpine-x64.tar.gz dist/*-alpine-arm64.tar.gz; do
            openssl dgst -sha256 -sign "$K" -out "$f.der" "$f"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/pub.pem" -signature "$f.der" "$f" >/dev/null
            base64 -w0 "$f.der" > "$f.sig"; rm -f "$f.der"; n=$((n+1))
          done
          shred -u "$K" 2>/dev/null || rm -f "$K"
          echo "pacchetti firmati: $n"; [ "$n" -gt 0 ]
      # softprops fissato alla sua impronta (v2.6.2): un tag spostato da altri non cambia il codice che pubblica la release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: YA-NEC ${{ env.VER }}
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release.md
          files: dist/*
