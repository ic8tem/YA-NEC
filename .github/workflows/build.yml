# YA-NEC - compilazione e pacchetti per Windows, Linux e Mac.
# Con un push sul ramo release, o un tag vX.Y (o avviandolo a mano): pacchetti di tutte le piattaforme e Release vX.Y (versione letta dal file VERSION).
# A ogni push sul ramo main: solo una compilazione di controllo su Linux (Windows 7 compreso).
# Nomi dei pacchetti: YA-NEC-<versione>-<rid>.zip e .zip.sha256, quelli che l'aggiornamento automatico cerca (src/Diag/Aggiornamento.cs).
name: build

on:
  push:
    branches: [ main, release ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  controllo:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Compila (.NET 8)
        run: dotnet build YA-NEC.csproj -c Release
      - name: Compila per Windows 7 (.NET 6)
        run: |
          rm -rf /tmp/w7 && mkdir /tmp/w7 && git archive HEAD | tar -x -C /tmp/w7
          dotnet build /tmp/w7/YA-NEC.csproj -c Release -p:Windows7=true

  pacchetti:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,          nome: win-x64,          w7: false, os: ubuntu-latest }
          - { rid: win-x86,          nome: win-x86,          w7: false, os: ubuntu-latest }
          - { rid: win-arm64,        nome: win-arm64,        w7: false, os: ubuntu-latest }
          - { rid: win-x64,          nome: win7-x64,         w7: true,  os: ubuntu-latest }
          - { rid: win-x86,          nome: win7-x86,         w7: true,  os: ubuntu-latest }
          - { rid: linux-x64,        nome: linux-x64,        w7: false, os: ubuntu-latest }
          - { rid: linux-arm64,      nome: linux-arm64,      w7: false, os: ubuntu-latest }
          - { rid: linux-arm,        nome: linux-arm,        w7: false, os: ubuntu-latest }
          - { rid: linux-musl-x64,   nome: linux-musl-x64,   w7: false, os: ubuntu-latest }
          - { rid: linux-musl-arm64, nome: linux-musl-arm64, w7: false, os: ubuntu-latest }
          - { rid: osx-arm64,        nome: osx-arm64,        w7: false, os: macos-latest }
          - { rid: osx-x64,          nome: osx-x64,          w7: false, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Versione
        shell: bash
        run: echo "VER=$(tr -d ' \r\n' < VERSION)" >> $GITHUB_ENV
      - name: Compila
        shell: bash
        run: dotnet publish YA-NEC.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Windows7=${{ matrix.w7 }} -p:Version=$VER -o pub/YA-NEC
      - name: Pacchetto
        shell: bash
        run: |
          rm -rf pub/YA-NEC/data/prove pub/YA-NEC/data/config.ini pub/YA-NEC/Registri
          case "${{ matrix.rid }}" in win-*) ;; *) chmod +x pub/YA-NEC/YA-NEC ;; esac
          if [[ "${{ matrix.rid }}" == osx-* ]]; then codesign --force -s - pub/YA-NEC/YA-NEC; for f in pub/YA-NEC/lib/*.dylib; do codesign --force -s - "$f" || true; done; fi
          mkdir -p dist
          Z="YA-NEC-$VER-${{ matrix.nome }}.zip"
          (cd pub && zip -qr -y "../dist/$Z" YA-NEC)
          (cd dist && shasum -a 256 "$Z" | awk -v n="$Z" '{print $1"  "n}' > "$Z.sha256")
          ls -l dist
      - name: Prova di avvio (autotest del motore)
        if: matrix.rid == 'linux-x64'
        run: timeout 600 ./pub/YA-NEC/YA-NEC --autotest 2>&1 | tail -40 || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome }}
          path: dist/*

  # 1.0.5 (IC8TEM 16/11/2026 15:55 "mi devi fare l'installatore per ya-nec"): installatori costruiti dagli zip appena compilati.
  # Windows: setup.exe con Inno Setup (C:\YA-NEC, senza amministratore); Linux: .deb e .rpm (/opt/YA-NEC); Mac: .dmg.
  installatori-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    needs: [ pacchetti ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: zip
          pattern: win*
          merge-multiple: true
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: setup.exe per ogni pacchetto Windows
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($n in 'win-x64','win-x86','win-arm64','win7-x64','win7-x86') {
            $z = "zip\YA-NEC-$ver-$n.zip"
            Expand-Archive $z -DestinationPath "x\$n" -Force
            $arch = ($n -split '-')[1]
            $extra = @(); if ($n -like 'win7*') { $extra += '/DWin7' }
            & $iscc "/DVer=$ver" "/DArch=$arch" "/DNome=$n" "/DSrc=$PWD\x\$n\YA-NEC" "/DOut=$PWD\dist" "/DIcona=$PWD\assets\ya-nec.ico" @extra installer\windows\ya-nec.iss
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem dist | ForEach-Object { $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: installatori-windows
          path: dist/*

  installatori-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    needs: [ pacchetti ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: zip
          pattern: linux-*
          merge-multiple: true
      - name: .deb e .rpm
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          VER=$(tr -d ' \r\n' < VERSION)
          for t in "linux-x64 amd64 x86_64" "linux-arm64 arm64 aarch64" "linux-arm armhf armv7hl"; do
            set -- $t
            rm -rf x && mkdir x && unzip -q "zip/YA-NEC-$VER-$1.zip" -d x
            bash installer/linux/pacchetti.sh "$PWD/x/YA-NEC" "$VER" "$2" "$3" "$PWD/dist"
          done
          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done; ls -l)
      - uses: actions/upload-artifact@v4
        with:
          name: installatori-linux
          path: dist/*

  installatori-mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    needs: [ pacchetti ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: zip
          pattern: osx-*
          merge-multiple: true
      - name: .dmg
        run: |
          VER=$(tr -d ' \r\n' < VERSION)
          for n in osx-arm64 osx-x64; do
            rm -rf x && mkdir x && ditto -x -k "zip/YA-NEC-$VER-$n.zip" x
            bash installer/macos/dmg.sh "$PWD/x/YA-NEC" "$VER" "$n" "$PWD/dist"
          done
          (cd dist && for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done; ls -l)
      - uses: actions/upload-artifact@v4
        with:
          name: installatori-mac
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    needs: [ pacchetti, installatori-windows, installatori-linux, installatori-mac ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        run: echo "VER=$(tr -d ' \r\n' < VERSION)" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Descrizioni per winget, Scoop e Chocolatey (da inviare ai registri solo se IC8TEM lo decide)
        run: |
          python3 installer/gestori/genera.py "$VER" dist gestori
          (cd gestori && zip -qr "../dist/YA-NEC-$VER-gestori-winget-scoop-chocolatey.zip" .)
      - uses: softprops/action-gh-release@v2
        with:
          name: YA-NEC ${{ env.VER }}
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release.md
          files: dist/*
